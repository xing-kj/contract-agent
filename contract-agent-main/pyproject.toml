[project]
name = "contract-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.11",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# 仅问答的向量检索模式需要；auto 模式（合同≤3万字全文作答）用不到
retrieve = [
    "fastembed>=0.9.1",
    "qdrant-client>=1.20.0",
]

[project.scripts]
contract-agent = "contract_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette 的测试客户端提醒换成 httpx2，不影响测试结果
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
